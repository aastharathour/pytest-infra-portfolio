trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: "3.12"
  TARGET_MODE: local

stages:
  - stage: Smoke
    displayName: Smoke gate
    jobs:
      - job: smoke
        displayName: pytest -m smoketests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - script: python -m pytest -m smoketests -q
            displayName: Smoke tests

  - stage: Full
    displayName: Full suite with reports
    dependsOn: Smoke
    jobs:
      - job: full
        displayName: pytest (all) with reports
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - script: >
              python -m pytest
              --junitxml=reports/junit.xml
              --cov=framework --cov-report=xml:reports/coverage.xml --cov-report=term
              --cov-fail-under=80
              --html=reports/report.html --self-contained-html
            displayName: Run full suite
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/junit.xml
              testRunTitle: pytest-infra-portfolio
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: reports/coverage.xml
          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: reports
              artifact: test-reports
