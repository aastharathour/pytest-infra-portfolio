[pytest]
testpaths = tests
python_files = test_*.py
# Only stable, environment-independent defaults live here.
# Per-run outputs (report paths, -m filters) are passed by the CI pipeline.
addopts = -v --tb=short --no-header --strict-markers
markers =
    smoketests: Fast, read-only checks safe to run on every commit
    slow: Mutates state or waits for conditions
    health: Service availability and latency
    crud: Create/read/update/delete behaviour of the items API
    framework: Tests of the framework's own hooks and helpers
    lifecycle: Ordered scenarios using pytest-dependency
    remote_only: Only meaningful against a remote deployment (skipped in local mode)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO
